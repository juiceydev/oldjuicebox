name: Release juicebox-plus

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: juicebox-plus -> target

      - name: Convert PNG to ICO
        run: |
          python -c "
          from PIL import Image
          img = Image.open('juicebox-plus/assets/logo.png')
          img.save('juicebox-plus/assets/icon.ico', format='ICO',
                   sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])
          "

      - name: Build binary
        run: cargo build --manifest-path juicebox-plus/Cargo.toml --release

      - name: Install cargo-wix
        run: cargo install cargo-wix

      - name: Generate WiX template
        run: cargo wix init --manifest-path juicebox-plus/Cargo.toml

      - name: Build MSI installer
        run: cargo wix --manifest-path juicebox-plus/Cargo.toml --no-build

      - name: Collect artifacts
        run: |
          cp juicebox-plus/target/release/juicebox-plus.exe juicebox-plus-windows-x64.exe
          cp juicebox-plus/target/wix/juicebox-plus-*.msi juicebox-plus-windows-x64.msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            juicebox-plus-windows-x64.exe
            juicebox-plus-windows-x64.msi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: juicebox-plus -> target

      - name: Build (ARM64)
        run: cargo build --manifest-path juicebox-plus/Cargo.toml --release --target aarch64-apple-darwin

      - name: Build (x86_64)
        run: cargo build --manifest-path juicebox-plus/Cargo.toml --release --target x86_64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create -output juicebox-plus-macos-universal \
            juicebox-plus/target/aarch64-apple-darwin/release/juicebox-plus \
            juicebox-plus/target/x86_64-apple-darwin/release/juicebox-plus
          chmod +x juicebox-plus-macos-universal

      - name: Convert PNG to ICNS
        run: |
          ICONSET=AppIcon.iconset
          mkdir -p "$ICONSET"
          SRC=juicebox-plus/assets/logo.png
          sips -z 16 16 "$SRC" --out "$ICONSET/icon_16x16.png"
          sips -z 32 32 "$SRC" --out "$ICONSET/icon_16x16@2x.png"
          sips -z 32 32 "$SRC" --out "$ICONSET/icon_32x32.png"
          sips -z 64 64 "$SRC" --out "$ICONSET/icon_32x32@2x.png"
          sips -z 128 128 "$SRC" --out "$ICONSET/icon_128x128.png"
          sips -z 256 256 "$SRC" --out "$ICONSET/icon_128x128@2x.png"
          sips -z 256 256 "$SRC" --out "$ICONSET/icon_256x256.png"
          sips -z 512 512 "$SRC" --out "$ICONSET/icon_256x256@2x.png"
          sips -z 512 512 "$SRC" --out "$ICONSET/icon_512x512.png"
          sips -z 1024 1024 "$SRC" --out "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o AppIcon.icns

      - name: Create .app bundle
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' juicebox-plus/Cargo.toml | head -1)
          APP="Juicebox+.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"

          cp juicebox-plus-macos-universal "$APP/Contents/MacOS/juicebox-plus"
          cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          sed "s/@VERSION@/$VERSION/g" juicebox-plus/packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          cp juicebox-plus/packaging/macos/PkgInfo "$APP/Contents/PkgInfo"

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Juicebox+" \
            -srcfolder "Juicebox+.app" \
            -ov \
            -format UDZO \
            juicebox-plus-macos-universal.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            juicebox-plus-macos-universal
            juicebox-plus-macos-universal.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: juicebox-plus -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libappindicator3-dev libxdo-dev libdbus-1-dev \
            libssl-dev pkg-config dpkg-dev fakeroot rpm

      - name: Build binary
        run: cargo build --manifest-path juicebox-plus/Cargo.toml --release

      - name: Build .deb
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' juicebox-plus/Cargo.toml | head -1)
          PKG=pkg-deb
          mkdir -p "$PKG/DEBIAN"
          mkdir -p "$PKG/usr/bin"
          mkdir -p "$PKG/usr/share/applications"
          mkdir -p "$PKG/usr/share/icons/hicolor/256x256/apps"

          cp juicebox-plus/target/release/juicebox-plus "$PKG/usr/bin/"
          cp juicebox-plus/assets/logo.png "$PKG/usr/share/icons/hicolor/256x256/apps/juicebox-plus.png"
          cp juicebox-plus/packaging/linux/juicebox-plus.desktop "$PKG/usr/share/applications/"
          cp juicebox-plus/packaging/linux/debian/control "$PKG/DEBIAN/control"
          echo "Version: $VERSION" >> "$PKG/DEBIAN/control"

          dpkg-deb --build "$PKG" juicebox-plus-linux-amd64.deb

      - name: Build .rpm
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' juicebox-plus/Cargo.toml | head -1)
          sudo apt-get install -y ruby 2>/dev/null
          gem install fpm --no-document
          fpm -s dir -t rpm \
            --package juicebox-plus-linux-x86_64.rpm \
            -n juicebox-plus -v "$VERSION" \
            --depends libgtk-3-0 --depends libappindicator3-1 --depends libdbus-1-3 \
            -a x86_64 \
            -C juicebox-plus/target/release \
            juicebox-plus=/usr/bin/juicebox-plus

      - name: Build AppImage
        run: |
          APPDIR=juicebox-plus/appimage-staging
          mkdir -p "$APPDIR/usr/bin"
          mkdir -p "$APPDIR/usr/share/applications"
          mkdir -p "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp juicebox-plus/target/release/juicebox-plus "$APPDIR/usr/bin/"
          cp juicebox-plus/assets/logo.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/juicebox-plus.png"
          cp juicebox-plus/assets/logo.png "$APPDIR/juicebox-plus.png"
          cp juicebox-plus/packaging/linux/juicebox-plus.desktop "$APPDIR/"
          cp "$APPDIR/juicebox-plus.desktop" "$APPDIR/usr/share/applications/"

          curl -sSL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$APPDIR" juicebox-plus-linux-x86_64.AppImage

      - name: Collect artifacts
        run: |
          mkdir -p linux-artifacts
          cp juicebox-plus-linux-x86_64.AppImage linux-artifacts/
          cp juicebox-plus-linux-amd64.deb linux-artifacts/
          cp juicebox-plus-linux-x86_64.rpm linux-artifacts/

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: linux-artifacts/

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows/*
            artifacts/macos/*
            artifacts/linux/*
